openapi: 3.0.3
info:
  title: MELARIUM API
  version: 0.1.0
  description: |
    MELARIUM REST API kontrakti. API JSON formatida ishlaydi va /api/v1 orqali versiyalanadi.
    OTP autentifikatsiyasida email va telefon juftligi kiritiladi, tasdiqlash kodi SMS orqali telefonga yuboriladi.
    Moliyaviy endpointlar demo holatida; ma’lumotlar haqiqiy tranzaksiya yoki daromadni bildirmaydi.
servers:
  - url: http://localhost:8080/api/v1
    description: Local development
paths:
  /health:
    get:
      summary: API holati
      responses:
        '200':
          description: Xizmat ishlayapti
          content:
            application/json:
              schema:
                type: object
                properties:
                  service: { type: string, example: melarium-api }
                  status: { type: string, example: UP }
                  timestamp: { type: string, format: date-time }
                  timezone: { type: string, example: Asia/Tashkent }
  /auth/otp/request:
    post:
      summary: Email va telefon bilan OTP so‘rash
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpRequest' }
      responses:
        '202':
          description: OTP SMS orqali yuborildi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpRequestResponse' }
        '400': { description: Kiritilgan email yoki telefon noto‘g‘ri }
        '429': { description: OTP so‘rov limiti tugadi }
  /auth/otp/verify:
    post:
      summary: OTP kodi bilan telefonni tasdiqlash va tizimga kirish
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpVerifyRequest' }
      responses:
        '200':
          description: Sessiya tokenlari
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400': { description: Email OTP so‘rovidagi email bilan mos emas }
        '401': { description: OTP kodi noto‘g‘ri yoki yaroqsiz }
        '409': { description: Email boshqa hisobda ishlatilgan }
  /listings:
    get:
      summary: Faol takliflarni sahifalab olish
      parameters:
        - name: query
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 12 }
      responses:
        '200':
          description: Faol takliflar sahifasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOfListings'
  /listings/{id}:
    get:
      summary: Faol taklif tafsiloti
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Taklif tafsiloti
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '404': { description: Taklif topilmadi }
components:
  schemas:
    OtpRequest:
      type: object
      required: [phone, email]
      properties:
        phone: { type: string, maxLength: 30, example: '+998901234567' }
        email: { type: string, format: email, maxLength: 255, example: user@example.com }
    OtpVerifyRequest:
      type: object
      required: [phone, email, code]
      properties:
        phone: { type: string, maxLength: 30, example: '+998901234567' }
        email: { type: string, format: email, maxLength: 255, example: user@example.com }
        code: { type: string, pattern: '^[0-9]{6}$', example: '123456' }
    OtpRequestResponse:
      type: object
      properties:
        phone: { type: string }
        expiresInSeconds: { type: integer, format: int64 }
        deliveryMode: { type: string, example: SMS }
        debugCode: { type: string, nullable: true }
    TokenResponse:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, example: Bearer }
        expiresInSeconds: { type: integer, format: int64 }
        user: { $ref: '#/components/schemas/AuthenticatedUser' }
    AuthenticatedUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        phone: { type: string }
        fullName: { type: string, nullable: true }
        roles:
          type: array
          items: { type: string }
    Listing:
      type: object
      required: [id, title, description, category, status, location, currency, unitPrice, unitsTotal, unitsAvailable]
      properties:
        id: { type: string, format: uuid }
        beekeeperId: { type: string, format: uuid }
        apiaryId: { type: string, format: uuid }
        title: { type: string, maxLength: 180 }
        description: { type: string }
        category: { type: string, example: COLONY }
        status: { type: string, enum: [active] }
        location: { type: string }
        currency: { type: string, example: UZS }
        unitPrice: { type: number, format: decimal }
        unitsTotal: { type: integer }
        unitsAvailable: { type: integer }
        createdAt: { type: string, format: date-time }
    PageOfListings:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/Listing' }
        totalElements: { type: integer }
        totalPages: { type: integer }
        number: { type: integer }
        size: { type: integer }
