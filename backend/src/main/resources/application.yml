server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  profiles:
    default: local
  application:
    name: melarium-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/melarium}
    username: ${DATABASE_USERNAME:melarium}
    password: ${DATABASE_PASSWORD:melarium_dev_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Tashkent
    default-property-inclusion: non_null

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    uz.melarium: INFO
    org.springframework.web: INFO

app:
  name: MELARIUM
  timezone: Asia/Tashkent
  demo-mode: ${APP_DEMO_MODE:true}
  security:
    jwt-secret-base64: ${JWT_SECRET_BASE64:bWVsYXJpdW0tbG9jYWwtZGV2LXNlY3JldC0zMi1ieXRlcyE=}
    otp-pepper-base64: ${OTP_PEPPER_BASE64:bWVsYXJpdW0tbG9jYWwtb3RwLXBlcHBlci1kZXYtb25seQ==}
    access-token-ttl: ${ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:P30D}
    expose-otp: ${AUTH_EXPOSE_OTP:true}
    admin-email: ${APP_SECURITY_ADMIN_EMAIL:}
    admin-phone: ${APP_SECURITY_ADMIN_PHONE:}
    super-admin-email: ${APP_SECURITY_SUPER_ADMIN_EMAIL:}
    super-admin-phone: ${APP_SECURITY_SUPER_ADMIN_PHONE:}
  sms:
    provider: ${SMS_PROVIDER:log}
    api-url: ${SMS_API_URL:}
    api-token: ${SMS_API_TOKEN:}
    sender-id: ${SMS_SENDER_ID:MELARIUM}
