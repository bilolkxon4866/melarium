spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  demo-mode: false
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  security:
    jwt-secret-base64: ${JWT_SECRET_BASE64}
    otp-pepper-base64: ${OTP_PEPPER_BASE64}
    access-token-ttl: ${ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:P30D}
    expose-otp: false
  sms:
    provider: http
    api-url: ${SMS_API_URL}
    api-token: ${SMS_API_TOKEN}
    sender-id: ${SMS_SENDER_ID}
